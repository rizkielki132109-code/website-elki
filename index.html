<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Elki</title>
    <style>

            display: flex;
            justify-content: center;
            align-items: center;

           width: 130px;
    height: 130px;

    display: block;
    object-fit: cover;
    border: 4px solid #667eea;
        }
        h1 { margin: 15px 0 5px 0; }
        .jurusan { color: #667eea; font-weight: bold; margin: 0; }
        .bio { color: #555; font-size: 14px; }
        .info { text-align: left; background: #f5f5f5; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .info p { margin: 8px 0; }
        .btn {
            display: block;
            background: linear-gradient(90deg, #0077b6, #00c853);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

</html>
